webdriver {
  driver = chrome
  timeouts {
    implicitlywait = 5000
    fluentwait = 10000
  }
}

headless.mode = false

chrome.switches = """--start-maximized;--no-sandbox;--ignore-certificate-errors;--disable-popup-blocking;--incognito;--disable-gpu;--disable-dev-shm-usage"""

serenity {
  project.name = "PracticeSoftwareTesting - Automation Tests"
  take.screenshots = FOR_FAILURES
}

environments {
  default {
    webdriver.base.url = "https://practicesoftwaretesting.com"
  }
  qa {
    webdriver.base.url = "https://practicesoftwaretesting.com"
  }
  dev {
    webdriver.base.url = "http://localhost:8080/"
  }
}
